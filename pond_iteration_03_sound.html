function initialisePond() {
  const anchors = [
    { x: 100, y: 61, z: 106 },
    { x: 76, y: 80, z: 161 },
    { x: 132, y: 49, z: 203 },
    { x: 97, y: 90, z: 248 },
    { x: 126, y: 73, z: 310 },
    { x: 74, y: 58, z: 383 }
  ];
  fragments = PROMPTS.map((content, i) => {
    const position = i < anchors.length ? anchors[i] : {
      x: 15 + random01() * 170,
      y: 34 + Math.pow(random01(), 0.6) * 63,
      z: 32 + random01() * 446
    };
      return { ...position, ...createFlowState(), lines: content.split('\n'), id: i };
  });

  for (let i = 0; i < 42; i++) {
    fragments.push({
      x: 7 + random01() * 186,
      y: SEDIMENT_START + random01() * 9.8,
      z: 15 + random01() * 468,
      ...createFlowState(),
      lines: PROMPTS[Math.floor(random01() * PROMPTS.length)].split('\n'),
      id: PROMPTS.length + i
    });
  }

  const sourceLines = PROMPTS.map(s => s.replace(/\n/g, ' ').split(' '));
  sedimentFragments = [];
  for (let i = 0; i < 230; i++) {
    const words = sourceLines[Math.floor(random01() * sourceLines.length)];
    const index = Math.floor(random01() * words.length);
    const count = 1 + Math.floor(random01() * 5);
    const phrase = words.slice(index, index + count).join(' ');
    sedimentFragments.push({
      x: 4 + random01() * 192,
      y: SEDIMENT_START + Math.pow(random01(), 0.8) * 9.8,
      z: 9 + random01() * 481,
      ...createFlowState(),
      line: phrase,
      id: i + 2000,
      tone: random01(),
      phase: random01() * 6.28318
    });
  }

  const alphabet = '._-:;+/\\|*?()[]{}~abcdefghijklmnopqrstuvwxyz';
  particles = [];
  for (let i = 0; i < 230; i++) particles.push(makeParticle(i, false, alphabet));
  for (let i = 0; i < 1150; i++) particles.push(makeParticle(i + 230, true, alphabet));
}

function createFlowState() {
  return { vx: 0, vy: 0, vz: 0, flowPhase: random01() * 6.28318 };
}

function makeParticle(id, sediment, alphabet) {
  return {
    x: random01() * POND.width,
    y: sediment ? SEDIMENT_START + random01() * 9.8 : 15 + random01() * 85,
    z: random01() * POND.length,
    vx: (random01() - 0.5) * (sediment ? 0.10 : 0.20),
    vy: (random01() - 0.5) * (sediment ? 0.035 : 0.10),
    vz: (random01() - 0.5) * (sediment ? 0.10 : 0.20),
    char: alphabet[Math.floor(random01() * alphabet.length)],
    bright: random01(),
    sediment,
    dart: 0,
    id
  };
}

  uploadPanel.appendChild(uploadStatus);
  uploadPanel.appendChild(hint);

  uploadPanel.appendChild(sensorButton);
  uploadPanel.appendChild(sensorStatus);
  uploadPanel.appendChild(sensorHint);

  uploadPanel.appendChild(pitchLowControl.row);
  uploadPanel.appendChild(pitchHighControl.row);
  uploadPanel.appendChild(audioStatus);
  document.body.appendChild(uploadPanel);
}

function styleAudioButton(button) {
  button.style.font = '11px monospace';
  button.style.padding = '6px 9px';
  button.style.background = 'rgba(20, 43, 39, 0.94)';
  button.style.color = 'rgba(216,236,228,0.92)';
  button.style.border = '1px solid rgba(172,208,191,0.35)';
  button.style.cursor = 'pointer';
}

function createAudioRange(label, min, max, step, initial, format, onInput) {
  const row = document.createElement('label');
  row.style.display = 'block';
  row.style.marginTop = '7px';
  const heading = document.createElement('div');
  heading.style.display = 'flex';
  heading.style.justifyContent = 'space-between';
  const name = document.createElement('span');
  name.textContent = label;
  const value = document.createElement('span');
  value.textContent = format(initial);
  heading.appendChild(name);
  heading.appendChild(value);
  const input = document.createElement('input');
  input.type = 'range';
  input.min = String(min);
  input.max = String(max);
  input.step = String(step);
  input.value = String(initial);
  input.style.width = '100%';
  input.style.margin = '3px 0 0';
  input.addEventListener('input', () => {
    const number = Number(input.value);
    value.textContent = format(number);
    if (onInput) onInput(number);
  });
  row.appendChild(heading);
  row.appendChild(input);
  input.row = row;
  return input;
}

async function toggleAudio() {
  if (audioEnabled) {
    await audioContext.suspend();
    audioEnabled = false;
    audioButton.textContent = 'Enable audio';
    audioStatus.textContent = 'Audio off.';
    return;
  }
  if (!window.AudioContext && !window.webkitAudioContext) {
    audioStatus.textContent = 'Web Audio is not available in this browser.';
    return;
  }
  audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
  if (!audioMasterGain) {
    audioMasterGain = audioContext.createGain();
    audioMasterGain.gain.value = Number(volumeControl.value);
    audioMasterGain.connect(audioContext.destination);
  }
  await audioContext.resume();
  audioEnabled = true;
  audioButton.textContent = 'Mute audio';
  audioStatus.textContent = 'Audio on - waiting for a voltage spike.';
}

function updateAudioVolume(value) {
  if (audioMasterGain && audioContext) {
    audioMasterGain.gain.setTargetAtTime(value, audioContext.currentTime, 0.025);
  }
}

function updateSignalRange() {
  const center = Number(signalCenterControl.value);
  const span = Number(signalSpanControl.value);
  const low = center - span * 0.5;
  const high = center + span * 0.5;
  traceRangeDisplay.textContent = `${Math.round(low)}-${Math.round(high)} mV / ${Math.round(span)} mV span`;
  if (drawingContext) draw();
}

function mapVoltageToPitch(reading) {
  const low = Number(pitchLowControl.value);
  const high = Math.max(low, Number(pitchHighControl.value));
  const center = Number(signalCenterControl.value);
  const span = Math.max(1, Number(signalSpanControl.value));
  const position = clamp((reading - (center - span * 0.5)) / span, 0, 1);
  return low * Math.pow(high / low, position);
}

function startVoltageVoice(frequency) {
  if (!audioEnabled || !audioContext || !audioMasterGain) return;
  if (!voiceOscillator) {
    voiceOscillator = audioContext.createOscillator();
    voiceGain = audioContext.createGain();
    voiceOscillator.type = waveformControl.value;
    voiceGain.gain.value = 0.0001;
    voiceOscillator.connect(voiceGain);
    voiceGain.connect(audioMasterGain);
    voiceOscillator.start();
  }
  const now = audioContext.currentTime;
  voiceOscillator.type = waveformControl.value;
  voiceOscillator.frequency.setTargetAtTime(frequency, now, 0.04);
  voiceGain.gain.setTargetAtTime(0.42, now, 0.04);
  latestToneFrequency = frequency;
  latestToneDisplay.textContent = `${Math.round(frequency)} Hz / tracking`;
}

function stopVoltageVoice() {
  if (!voiceOscillator || !audioContext) return;
  const oscillator = voiceOscillator;
  const gain = voiceGain;
  voiceOscillator = null;
  voiceGain = null;
  const now = audioContext.currentTime;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setTargetAtTime(0.0001, now, 0.025);
  oscillator.stop(now + 0.12);
}

function playMappedTone(frequency) {
  if (!audioEnabled) {
    audioStatus.textContent = 'Signal event detected - enable audio to hear it.';
    return;
  }
  stopVoltageVoice();
  playTone(frequency, Number(noteDurationControl.value));
  lastToneAt = Date.now();
  latestToneFrequency = frequency;
  latestToneDisplay.textContent = `${Math.round(frequency)} Hz`;
  audioStatus.textContent = `Input event - ${Math.round(frequency)} Hz.`;
}

function playTone(frequency, duration = 0.22) {
  if (!audioEnabled || !audioContext || !audioMasterGain) return;
  const now = audioContext.currentTime;
  const oscillator = audioContext.createOscillator();
  const envelope = audioContext.createGain();
  oscillator.type = waveformControl.value;
  oscillator.frequency.setValueAtTime(frequency, now);
  envelope.gain.setValueAtTime(0.0001, now);
  envelope.gain.exponentialRampToValueAtTime(0.8, now + 0.015);
  envelope.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  oscillator.connect(envelope);
  envelope.connect(audioMasterGain);
  oscillator.start(now);
  oscillator.stop(now + duration + 0.02);
}

async function playTestTone() {
  if (!audioEnabled) await toggleAudio();
  if (!audioEnabled) return;
  const frequency = mapVoltageToPitch(Number(signalCenterControl.value));
  playTone(frequency, 0.35);
  latestToneFrequency = frequency;
  latestToneDisplay.textContent = `${Math.round(frequency)} Hz / test`;
  audioStatus.textContent = `Test tone - ${Math.round(frequency)} Hz.`;
}

function handleSensorReading(reading) {
  const now = Date.now();
  const previous = previousSensorReading;
  const change = previous === null ? 0 : reading - previous;
  sensorMillivolts = reading;
  sensorLastReadingAt = now;
  dataTimedOut = false;
  connectionDot.classList.add('active');
  sensorStatus.textContent = `Connected - ${Math.round(reading)} mV`;
  sampleCount++;
  const sampleTime = performance.now();
  sensorHistory.push({ value: reading, change, time: sampleTime });
  if (sensorHistory.length > 300) sensorHistory.shift();
  liveValueDisplay.textContent = String(Math.round(reading));
  deltaDisplay.textContent = previous === null ? '-- mV' : `${change > 0 ? '+' : ''}${Math.round(change)} mV`;
  sampleCountDisplay.textContent = String(sampleCount);
  if (sensorHistory.length > 1) {
    const recent = sensorHistory.slice(-16);
    const elapsed = recent[recent.length - 1].time - recent[0].time;
    sampleRateDisplay.textContent = elapsed > 0 ? `${((recent.length - 1) * 1000 / elapsed).toFixed(1)} samples/s` : 'Measuring rate';
  }

  const isSpike = previous !== null && reading >= Number(triggerFloorControl.value) &&
    change >= Number(spikeThresholdControl.value);
  if (isSpike) {
    spikeCount++;
    spikeCountDisplay.textContent = String(spikeCount);
  }
  const division = Number(beatDivisionControl.value);
  const mode = audioModeControl.value;
  if (mode === 'spike' && isSpike && spikeCount % division === 0) {
    playMappedTone(mapVoltageToPitch(reading));
  } else if (mode === 'pulse' && reading >= Number(triggerFloorControl.value) && sampleCount % division === 0 && now - lastToneAt >= 100) {
    playMappedTone(mapVoltageToPitch(reading));
  } else if (mode === 'track' && reading >= Number(triggerFloorControl.value)) {
    startVoltageVoice(mapVoltageToPitch(reading));
  } else {
    stopVoltageVoice();
  }

  if (reading <= 0) {
    previousSensorReading = null;
    stopVoltageVoice();
  } else {
    previousSensorReading = reading;
  }
}

async function toggleSensorConnection() {
  if (sensorPort) {
    if (sensorReader) await sensorReader.cancel();
    return;
  }
  if (!navigator.serial) {
    sensorStatus.textContent = 'Web Serial unavailable - use Chrome or Edge on localhost.';
    return;
  }
  try {
    sensorStatus.textContent = 'Choose the Arduino serial port...';
    sensorPort = await navigator.serial.requestPort();
    await sensorPort.open({ baudRate: 9600 });
    sensorConnected = true;
    dataTimedOut = false;
    connectionDot.classList.add('active');
    sensorButton.textContent = 'Disconnect sensor';
    sensorStatus.textContent = 'Connected - no serial data yet';
    sensorLastReadingAt = Date.now();
    sensorWatchdog = setInterval(() => {
      if (sensorConnected && !dataTimedOut && Date.now() - sensorLastReadingAt > 1000) {
        showNoData('No data for 1s - output set to 0 mV');
      }
    }, 250);
    const reader = sensorPort.readable.getReader();
    sensorReader = reader;
    const decoder = new TextDecoder();
    let pending = '';
    let receivedBytes = 0;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      receivedBytes += value.byteLength;
      pending += decoder.decode(value, { stream: true });
      const lines = pending.split(/\r?\n/);
      pending = lines.pop();
      if (pending.length > 256) pending = pending.slice(-256);
      for (const line of lines) {
        if (!line.trim()) continue;
        const reading = parseSensorMillivolts(line);
        if (reading === null) {
          const raw = line.replace(/[^\x20-\x7E]/g, '?').slice(0, 28);
          sensorStatus.textContent = `RX ${receivedBytes} bytes - unparsed: ${raw}`;
          continue;
        }
        handleSensorReading(reading);
      }
      if (pending && !lines.some(line => line.trim())) {
        const raw = pending.replace(/[^\x20-\x7E]/g, '?').slice(-28);
        sensorStatus.textContent = `RX ${receivedBytes} bytes - partial: ${raw}`;
      }
    }
  } catch (error) {
    connectionDot.classList.remove('active');
    sensorStatus.textContent = error.message.includes('Failed to open serial port')
      ? 'Could not open port - close Serial Monitor/Plotter and retry.'
      : `Serial connection ended: ${error.message}`;
  } finally {
    const wasConnected = sensorConnected;
    if (sensorWatchdog) clearInterval(sensorWatchdog);
    sensorWatchdog = null;
    if (sensorReader) sensorReader.releaseLock();
    sensorReader = null;
    if (sensorPort) {
      try { await sensorPort.close(); } catch (error) {}
    }
    sensorPort = null;
    sensorConnected = false;
    sensorButton.textContent = 'Connect serial';
    if (wasConnected) showNoData('Disconnected - 0 mV');
    else connectionDot.classList.remove('active');
  }
}

function parseSensorMillivolts(line) {
  const match = line.trim().match(/-?\d+(?:\.\d+)?/);
  if (!match) return null;
  const hasVolts = /\bV\b/i.test(line) && !/mV/i.test(line);
  const reading = Number(match[0]) * (hasVolts ? 1000 : 1);
  return Number.isFinite(reading) ? clamp(reading, 0, 400) : null;
}

function loadSelectedImages(fileList) {
  const files = Array.from(fileList || []).filter(file => file.type && file.type.startsWith('image/'));
  if (!files.length) return;
  clearUploadedImages(false);
  uploadStatus.textContent = `Loading ${files.length} image${files.length === 1 ? '' : 's'}...`;
  let loaded = 0;
  files.forEach((file, index) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      uploadedImages[index] = { img, name: file.name };
      URL.revokeObjectURL(url);
      loaded++;
      if (loaded === files.length) {
        uploadedImages = uploadedImages.filter(Boolean);
        distributeImageZones();
        imagesEnabled = uploadedImages.length > 0;
        updateUploadStatus();
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      loaded++;
      if (loaded === files.length) {
        uploadedImages = uploadedImages.filter(Boolean);
        distributeImageZones();
        imagesEnabled = uploadedImages.length > 0;
        updateUploadStatus();
      }
    };
    img.src = url;
  });
  if (uploadInput) uploadInput.value = '';
}

function clearUploadedImages(updateStatus = true) {
  uploadedImages = [];
  imageZones = [];
  activeImageIndex = -1;
  imageBlendWeights = [];
  currentImageStrength = 0;
  imageState.currentName = 'none';
  imageState.nextName = 'none';
  if (updateStatus) updateUploadStatus();
}

function updateUploadStatus() {
  if (!uploadStatus) return;
  if (!uploadedImages.length) {
    uploadStatus.textContent = 'No images loaded. U opens the upload dialog.';
    return;
  }
  const zoneText = imageZones.length === 1 ? '1 image zone' : `${imageZones.length} image zones`;
  uploadStatus.textContent = `${uploadedImages.length} image${uploadedImages.length === 1 ? '' : 's'} loaded. ${zoneText}.`;
}

function distributeImageZones() {
  imageZones = [];
  const n = uploadedImages.length;
  if (!n) return;
  const yBands = [24, 52, 82];
  const zRadius = clamp((POND.length / Math.max(1, n)) * 0.88, 96, 185);
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / Math.max(1, n - 1);
    const x = 100 + Math.sin(t * Math.PI * 1.65 + i * 0.18) * 58;
    const z = mix(58, 442, t);
    const y = yBands[i % yBands.length];
    imageZones.push({
      imageIndex: i,
      x,
      y,
      z,
      rx: 86,
      ry: 28,
      rz: zRadius
    });
  }
  activeImageIndex = -1;
  imageBlendWeights = [];
}

function draw() {
  const ctx = drawingContext;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#0b1512';
  ctx.fillRect(0, 0, width, height);
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const center = Number(signalCenterControl.value);
  const span = Number(signalSpanControl.value);
  const low = center - span * 0.5;
  const high = center + span * 0.5;
  for (let division = 0; division <= 4; division++) {
    const fraction = division / 4;
    const y = fraction * height;
    ctx.strokeStyle = 'rgba(157,179,168,0.15)';
    ctx.beginPath();
    ctx.moveTo(38, y);
    ctx.lineTo(width, y);
    ctx.stroke();
    ctx.fillStyle = 'rgba(157,179,168,0.72)';
    ctx.fillText(String(Math.round(high - fraction * span)), 30, y);
  }

  const threshold = Number(triggerFloorControl.value);
  const thresholdY = height - clamp((threshold - low) / span, 0, 1) * height;
  ctx.setLineDash([4, 5]);
  ctx.strokeStyle = 'rgba(237,170,114,0.62)';
  ctx.beginPath();
  ctx.moveTo(38, thresholdY);
  ctx.lineTo(width, thresholdY);
  ctx.stroke();
  ctx.setLineDash([]);

  if (sensorHistory.length < 2) return;
  const plotWidth = width - 42;
  const start = Math.max(0, sensorHistory.length - plotWidth);
  ctx.beginPath();
  for (let i = start; i < sensorHistory.length; i++) {
    const x = 40 + (i - start) / Math.max(1, sensorHistory.length - 1 - start) * (width - 44);
    const y = height - clamp((sensorHistory[i].value - low) / span, 0, 1) * height;
    if (i === start) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#c4e982';
  ctx.stroke();
  const last = sensorHistory[sensorHistory.length - 1];
  const lastY = height - clamp((last.value - low) / span, 0, 1) * height;
  ctx.fillStyle = last.change >= Number(spikeThresholdControl.value) ? '#edaa72' : '#c4e982';
  ctx.beginPath();
  ctx.arc(width - 4, lastY, 3, 0, Math.PI * 2);
  ctx.fill();
}

function showNoData(message) {
  if (sensorMillivolts !== 0 || previousSensorReading !== null) {
    handleSensorReading(0);
  } else {
    liveValueDisplay.textContent = '0';
    deltaDisplay.textContent = '-- mV';
    stopVoltageVoice();
  }
  dataTimedOut = true;
  sensorStatus.textContent = message;
  connectionDot.classList.remove('active');
}

function moveViewer(dt) {
  const fast = keyIsDown(16) ? 2.5 : 1;
  const speed = 0.66 * fast;
  const keyboardTurn = Number(keyIsDown(39)) - Number(keyIsDown(37));
  const turn = keyboardTurn;
  const keyboardForward = Number(keyIsDown(38)) - Number(keyIsDown(40));
  const forward = keyboardForward;
  let dx = Math.sin(viewer.yaw) * forward;
  let dz = Math.cos(viewer.yaw) * forward;
  let dy = Number(keyIsDown(69)) - Number(keyIsDown(81));
  const inputMagnitude = Math.hypot(dx, dy, dz);
  const movementScale = Math.min(1, inputMagnitude);
  const magnitude = inputMagnitude || 1;
  dx /= magnitude;
  dy /= magnitude;
  dz /= magnitude;

  const ease = 1 - Math.pow(0.78, dt);
  viewer.yaw += turn * ROTATION_SPEED * fast * dt;
  viewer.vx += (dx * speed * movementScale - viewer.vx) * ease;
  viewer.vy += (dy * speed * 0.65 * movementScale - viewer.vy) * ease;
  viewer.vz += (dz * speed * movementScale - viewer.vz) * ease;

  viewer.x = clamp(viewer.x + viewer.vx * dt, 4, 196);
  viewer.z = clamp(viewer.z + viewer.vz * dt, 0, 492);
  viewer.y = clamp(viewer.y + viewer.vy * dt, 5, 96);
}

function moveParticles(dt) {
  for (const p of particles) {
    const activity = stirLevel;
    const resistance = p.sediment ? 0.985 : 0.978;
    p.vx = p.vx * resistance + (Math.random() - 0.5) * (p.sediment ? 0.010 : 0.018) * activity * dt;
    p.vy = p.vy * resistance + (Math.random() - 0.5) * (p.sediment ? 0.004 : 0.012) * activity * dt;
    p.vz = p.vz * resistance + (Math.random() - 0.5) * (p.sediment ? 0.010 : 0.018) * activity * dt;
    if (Math.random() < (p.sediment ? 0.00025 : 0.00075) * activity * dt) {
      p.vx += (Math.random() - 0.5) * (p.sediment ? 0.9 : 2.6);
      p.vy += (Math.random() - 0.5) * (p.sediment ? 0.25 : 1.7);
      p.vz += (Math.random() - 0.5) * (p.sediment ? 0.9 : 2.6);
      p.dart = 18;
    }
    p.x = wrap(p.x + p.vx * dt * activity, POND.width);
    if (p.sediment) p.y = clamp(p.y + p.vy * dt * activity, 90.1, 99.8);
    else p.y = clamp(p.y + p.vy * dt * activity, 3, 99);
    p.z = wrap(p.z + p.vz * dt * activity, POND.length);
    p.dart = Math.max(0, p.dart - dt);
  }
}

function moveTextFragments(dt) {
  const easing = 1 - Math.pow(0.985, dt);
  for (const fragment of [...fragments, ...sedimentFragments]) {
    const centerX = fragment.x - POND.width * 0.5;
    const centerZ = fragment.z - POND.length * 0.5;
    const centerDistance = Math.max(1, Math.hypot(centerX, centerZ));
    const sourceX = fragment.x - sensorColumn.x;
    const sourceZ = fragment.z - sensorColumn.z;
    const sourceDistance = Math.max(1, Math.hypot(sourceX, sourceZ));
    const plume = stirLevel * Math.exp(-sourceDistance / 42);
    const nearBed = smooth(55, 96, fragment.y);
    const lift = plume * nearBed;
    const release = plume * (1 - nearBed);
    const phase = frameCount * 0.002 + fragment.flowPhase;

    let targetVx = centerZ / centerDistance * 0.008;
    let targetVz = -centerX / centerDistance * 0.008;
    targetVx -= sourceX / sourceDistance * lift * 0.012;
    targetVz -= sourceZ / sourceDistance * lift * 0.012;
    targetVx += sourceX / sourceDistance * release * 0.022;
    targetVz += sourceZ / sourceDistance * release * 0.022;
    targetVx += Math.sin(phase) * plume * 0.002;
    targetVz += Math.cos(phase * 0.83) * plume * 0.002;

    fragment.vx += (targetVx - fragment.vx) * easing;
    fragment.vy += ((fragment.y < 99 ? 0.005 : 0) - lift * 0.045 - fragment.vy) * easing;
    fragment.vz += (targetVz - fragment.vz) * easing;
    fragment.x = wrap(fragment.x + fragment.vx * dt, POND.width);
    fragment.y = clamp(fragment.y + fragment.vy * dt, 8, 99.8);
    fragment.z = wrap(fragment.z + fragment.vz * dt, POND.length);
  }
}

function updateImageCrossfade() {
  if (!imagesEnabled || !uploadedImages.length || !imageZones.length) {
    currentImageStrength = 0;
    imageBlendWeights = [];
    activeImageIndex = -1;
    imageState.currentName = 'none';
    imageState.nextName = 'none';
    return;
  }
  let bestIndex = 0;
  let bestStrength = -1;
  const zoneWeights = [];
  let totalWeight = 0;
  for (let i = 0; i < imageZones.length; i++) {
    const zone = imageZones[i];
    const strength = zoneStrength(zone);
    const distance = zoneDistance(zone);
    const weight = Math.exp(-2.0 * distance * distance);
    zoneWeights.push(weight);
    totalWeight += weight;
    if (strength > bestStrength) {
      bestStrength = strength;
      bestIndex = i;
    }
  }
  imageBlendWeights = zoneWeights.map(weight => weight / totalWeight);
  currentImageStrength = bestStrength;
  activeImageIndex = imageZones[bestIndex].imageIndex;
  imageState.currentName = uploadedImages[activeImageIndex] ? uploadedImages[activeImageIndex].name : 'none';
  const nextZone = imageZones.find((zone, index) => index !== bestIndex && imageBlendWeights[index] > 0.01);
  imageState.nextName = nextZone && uploadedImages[nextZone.imageIndex]
    ? uploadedImages[nextZone.imageIndex].name : 'none';
}

function zoneDistance(zone) {
  const dx = (viewer.x - zone.x) / zone.rx;
  const dy = (viewer.y - zone.y) / zone.ry;
  const dz = (viewer.z - zone.z) / zone.rz;
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function zoneStrength(zone) {
  return 1 - smooth(0.2, 1.45, zoneDistance(zone));
}

function paintWater() {
  const ctx = drawingContext;
  const bg = ctx.createLinearGradient(0, 0, 0, height);
  bg.addColorStop(0, '#071718');
  bg.addColorStop(0.58, '#081c1a');
  bg.addColorStop(1, '#0b1715');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);

  const nearBed = smooth(74, 98, viewer.y);
  const waterTint = currentImageStrength > 0 ? 0.14 + currentImageStrength * 0.18 : 0.12;
  ctx.fillStyle = `rgba(8,19,18,${waterTint.toFixed(3)})`;
  ctx.fillRect(0, 0, width, height);

  if (nearBed > 0.01) {
    ctx.fillStyle = `rgba(33,30,20,${(nearBed * 0.23).toFixed(3)})`;
    ctx.fillRect(0, 0, width, height);
  }
  const fog = ctx.createRadialGradient(width * 0.5, height * 0.48, 10,
    width * 0.5, height * 0.48, Math.max(width, height) * 0.65);
  fog.addColorStop(0, 'rgba(0,0,0,0)');
  fog.addColorStop(1, 'rgba(0,0,0,0.46)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, 0, width, height);
}

function drawPondImages() {
  if (!imageZones.length) return;
  const ctx = drawingContext;
  const candidates = [];
  for (const zone of imageZones) {
    const image = uploadedImages[zone.imageIndex];
    if (!image) continue;
    const p = project(zone.x, zone.y, zone.z);
    if (!p) continue;
    const aspect = image.img.width / Math.max(1, image.img.height);
    const imageWidth = 36 * p.factor;
    const imageHeight = imageWidth / aspect;
    const opacity = (0.06 + zoneStrength(zone) * 0.82) * depthOpacity(p.dz);
    candidates.push({
      image: image.img,
      dz: p.dz,
      x: p.x - imageWidth * 0.5,
      y: p.y - imageHeight * 0.5,
      width: imageWidth,
      height: imageHeight,
      opacity
    });
  }

  candidates.sort((a, b) => b.dz - a.dz);
  ctx.save();
  for (const candidate of candidates) {
    if (candidate.opacity <= 0.003) continue;
    ctx.globalAlpha = candidate.opacity;
    ctx.drawImage(candidate.image, candidate.x, candidate.y, candidate.width, candidate.height);
  }
  ctx.restore();
}

function project(x, y, z) {
  const offsetX = x - viewer.x;
  const offsetZ = z - viewer.z;
  const sinYaw = Math.sin(viewer.yaw);
  const cosYaw = Math.cos(viewer.yaw);
  const cameraX = offsetX * cosYaw - offsetZ * sinYaw;
  const dz = offsetX * sinYaw + offsetZ * cosYaw;
  if (dz < NEAR || dz > renderLimit()) return null;
  const focal = Math.min(width, height) * 0.88;
  const factor = focal / dz;
  return {
    x: width * 0.5 + cameraX * factor,
    y: height * 0.48 + (y - viewer.y) * factor,
    dz,
    factor
  };
}

function depthOpacity(dz) {
  const nearFade = smooth(NEAR, 38, dz);
  const fadeStart = fogEnabled ? Math.max(35, fogDistance * 0.39) : 145;
  const farFade = 1 - smooth(fadeStart, renderLimit(), dz);
  return nearFade * farFade;
}

function drawParticles() {
  const ctx = drawingContext;
  const sorted = particles.filter(p => !p.sediment || sedimentEnabled)
    .map(particle => ({ particle, projection: project(particle.x, particle.y, particle.z) }))
    .filter(entry => entry.projection)
    .sort((a, b) => b.projection.dz - a.projection.dz);
  visibleParticles = 0;
  visibleDeepParticles = 0;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const { particle, projection: p } of sorted) {
    if (particle.sediment && Math.abs(particle.y - viewer.y) > 34) continue;
    if (p.x < -30 || p.x > width + 30 || p.y < -30 || p.y > height + 30) continue;
    const focus = particle.sediment ? 1 - smooth(12, 34, Math.abs(particle.y - viewer.y)) : 1;
    const opacity = depthOpacity(p.dz) * focus * (particle.sediment
      ? (0.12 + 0.50 * particle.bright)
      : (0.08 + 0.28 * particle.bright));
    if (opacity < 0.010) continue;
    const size = clamp((particle.sediment ? 8.0 : 9) * 100 / p.dz, 5, particle.sediment ? 18 : 20);
    ctx.font = `${size}px monospace`;
    ctx.fillStyle = particle.sediment
      ? `rgba(167,170,127,${opacity.toFixed(3)})`
      : `rgba(154,208,187,${opacity.toFixed(3)})`;
    ctx.fillText(particle.char, p.x, p.y);
    visibleParticles++;
    if (particle.sediment) visibleDeepParticles++;
    if (particle.dart > 0 && p.dz < 115) {
      ctx.strokeStyle = `rgba(154,208,187,${(opacity * 0.25).toFixed(3)})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - particle.vx * p.factor * 4, p.y - particle.vy * p.factor * 4);
      ctx.stroke();
    }
  }
}

function corruptText(content, amount, id, row) {
  if (!scrambleEnabled || amount < 0.008) return content;
  const tick = Math.floor(frameCount / 6);
  let result = '';
  for (let i = 0; i < content.length; i++) {
    const char = content[i];
    if (char === ' ') { result += char; continue; }
    const shift = id * 31.7 + row * 91.3 + i * 19.7;
    const noise = hash01(shift + tick * 43.71);
    result += noise < amount
      ? GLYPHS[Math.floor(hash01(shift * 0.77 + tick * 17.53) * GLYPHS.length)]
      : char;
  }
  return result;
}

function hash01(value) {
  const n = Math.sin(value * 12.9898 + 78.233) * 43758.5453;
  return n - Math.floor(n);
}

function scrambleAmount(y, id, dz, isSediment) {
  if (!scrambleEnabled || stirLevel <= 0.005) return 0;
  const deep = smooth(58, 100, y);
  let amount = 0.025 + 0.79 * Math.pow(deep, 1.5);
  if (isSediment) amount = Math.max(0.55, amount + 0.09);
  const pulse = 0.82 + 0.17 * Math.sin(frameCount * 0.027 + id * 0.67)
                      + 0.10 * Math.sin(frameCount * 0.071 + id * 1.31);
  amount *= pulse;
  amount *= stirLevel;
  amount *= 1 - 0.23 * (1 - smooth(22, 90, dz));
  return clamp(amount, 0, 0.97);
}

function drawSedimentFragments() {
  const ctx = drawingContext;
  const selected = [];
  for (const fragment of sedimentFragments) {
    const phase = frameCount * 0.018 + fragment.phase;
    const driftX = Math.sin(phase) * stirLevel * 5;
    const driftY = Math.cos(phase * 0.7) * stirLevel * 1.8;
    const driftZ = Math.sin(phase * 0.43) * stirLevel * 8;
    const p = project(fragment.x + driftX, fragment.y + driftY, fragment.z + driftZ);
    if (!p || p.x < -100 || p.x > width + 100 || p.y < -50 || p.y > height + 50) continue;
    const proximity = 1 - smooth(12, 34, Math.abs(viewer.y - fragment.y));
    const opacity = depthOpacity(p.dz) * proximity * (0.28 + fragment.tone * 0.32);
    if (opacity < 0.022) continue;
    selected.push({ fragment, p, opacity });
  }
  selected.sort((a, b) => a.p.dz - b.p.dz);
  const toRender = selected.slice(0, 66).sort((a, b) => b.p.dz - a.p.dz);
  visibleSediment = toRender.length;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const {fragment, p, opacity} of toRender) {
    const size = clamp(11 * 108 / p.dz, 7, 22);
    const amount = scrambleAmount(fragment.y, fragment.id, p.dz, true);
    const text = corruptText(fragment.line, amount, fragment.id, 0);
    const microShift = scrambleEnabled ? Math.sin(frameCount * 0.17 + fragment.phase) * amount * 2.2 * stirLevel : 0;
    ctx.font = `${size}px monospace`;
    ctx.fillStyle = `rgba(188,193,150,${opacity.toFixed(3)})`;
    ctx.fillText(text, p.x + microShift, p.y);
  }
}

function drawFragments() {
  const ctx = drawingContext;
  const candidates = fragments.map(fragment => {
    const p = project(fragment.x, fragment.y, fragment.z);
    if (!p) return null;
    const vertical = 1 - smooth(34, 69, Math.abs(fragment.y - viewer.y));
    const centre = 1 - 0.76 * smooth(width * 0.16, width * 0.57, Math.abs(p.x - width * 0.5));
    const opacity = depthOpacity(p.dz) * vertical * centre;
    const size = clamp(13 * 108 / p.dz, 7, 31);
    const lineHeight = size * 1.45;
    const longest = Math.max(...fragment.lines.map(s => s.length));
    const box = {
      left: p.x - longest * size * 0.32 - 12,
      right: p.x + longest * size * 0.32 + 12,
      top: p.y - fragment.lines.length * lineHeight * 0.5 - 10,
      bottom: p.y + fragment.lines.length * lineHeight * 0.5 + 10
    };
    return { fragment, p, opacity, size, lineHeight, box };
  }).filter(o => o && o.opacity >= 0.08 &&
    o.p.x > -180 && o.p.x < width + 180 &&
    o.p.y > -110 && o.p.y < height + 110)
    .sort((a, b) => b.opacity - a.opacity);

  const selected = [];
  for (const c of candidates) {
    if (selected.length >= 7) break;
    const overlap = selected.some(s =>
      c.box.left < s.box.right && c.box.right > s.box.left &&
      c.box.top < s.box.bottom && c.box.bottom > s.box.top);
    if (!overlap) selected.push(c);
  }
  selected.sort((a, b) => b.p.dz - a.p.dz);
  visibleFragments = selected.length;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const { fragment, p, opacity, size, lineHeight } of selected) {
    const firstLineY = p.y - (fragment.lines.length - 1) * lineHeight * 0.5;
    ctx.font = `${size}px monospace`;
    ctx.fillStyle = `rgba(188,229,205,${(opacity * 0.92).toFixed(3)})`;
    const amount = scrambleAmount(fragment.y, fragment.id, p.dz, false);
    for (let i = 0; i < fragment.lines.length; i++) {
      const text = corruptText(fragment.lines[i], amount, fragment.id, i);
      const shift = scrambleEnabled ? Math.sin(frameCount * 0.13 + fragment.id * 2.7 + i) * amount * 4 : 0;
      ctx.fillText(text, p.x + shift, firstLineY + i * lineHeight);
    }
  }
}

function drawFloorGrid() {
  const ctx = drawingContext;
  ctx.lineWidth = 0.7;
  for (let z = 0; z <= POND.length; z += 25) {
    const a = project(0, 100, z);
    const b = project(200, 100, z);
    if (a && b) drawProjectedLine(ctx, a, b);
  }
  for (let x = 0; x <= 200; x += 20) {
    for (let z = 0; z < POND.length; z += 25) {
      const a = project(x, 100, z);
      const b = project(x, 100, z + 25);
      if (a && b) drawProjectedLine(ctx, a, b);
    }
  }
}

function drawProjectedLine(ctx, a, b) {
  const opacity = 0.15 * depthOpacity((a.dz + b.dz) * 0.5);
  if (opacity < 0.008) return;
  ctx.strokeStyle = `rgba(116,183,153,${opacity.toFixed(3)})`;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

function drawInterface() {
  const ctx = drawingContext;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '11px monospace';
  ctx.fillStyle = 'rgba(185,229,209,0.72)';
  ctx.fillText('POND   /   ITERATION 03   /   SENSOR TONES', 20, 28);
  ctx.fillStyle = 'rgba(166,200,186,0.50)';
  ctx.fillText(`X ${Math.round(viewer.x)}/200   DEPTH ${Math.round(viewer.y)}/100   LENGTH ${Math.round(viewer.z)}/500`, 20, 47);
  ctx.fillText(`FOG ${fogEnabled ? 'ON ' + fogDistance : 'OFF ' + FAR}cm   [ / ] adjust   F toggle   /   ${Math.round(fpsEstimate)} fps`, 20, height - 93);
  ctx.fillText(`TEXT ${visibleFragments}   SEDIMENT ${visibleSediment}   MOTILE LETTERS ${visibleParticles}  (${visibleDeepParticles} deep)`, 20, height - 75);
  const imageLine = uploadedImages.length
    ? `IMAGES ${uploadedImages.length}   ACTIVE ${shortName(imageState.currentName)}   STRENGTH ${currentImageStrength.toFixed(2)}`
    : 'IMAGES 0   Use the upload button or press U to add images';
  ctx.fillText(imageLine, 20, height - 57);
  ctx.fillText('← → rotate    ↑ ↓ forward/back    Q rise    E sink    SHIFT faster', 20, height - 39);
  ctx.fillText('T glitch    N bed layer    U upload    I images    H interface    G grid    R reset', 20, height - 22);

  const gx = width - 25, gy = 190, gh = Math.max(65, Math.min(160, height - 290));
  ctx.strokeStyle = 'rgba(172,208,191,0.32)';
  ctx.strokeRect(gx, gy, 7, gh);
  ctx.fillStyle = 'rgba(169,145,93,0.22)';
  ctx.fillRect(gx + 1, gy + gh * 0.9, 5, gh * 0.1 - 1);
  ctx.fillStyle = '#dce9cb';
  ctx.fillRect(gx - 3, gy + gh * viewer.y / 100 - 1, 13, 2);
  ctx.fillStyle = 'rgba(166,200,186,0.5)';
  ctx.fillText('0', gx - 11, gy - 6);
  ctx.fillText('100', gx - 25, gy + gh + 13);

  const mx = width - 95, my = 24, mw = 58, mh = 125;
  ctx.fillStyle = 'rgba(2,11,11,0.53)';
  ctx.fillRect(mx - 10, my - 8, mw + 20, mh + 34);
  ctx.strokeStyle = 'rgba(172,208,191,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx, my, mw, mh);
  for (const f of fragments) {
    const x = mx + f.x / POND.width * mw;
    const y = my + f.z / POND.length * mh;
    ctx.fillStyle = f.y >= SEDIMENT_START ? 'rgba(188,166,112,0.20)' : 'rgba(155,199,168,0.24)';
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  if (uploadedImages.length) {
    for (const zone of imageZones) {
      const zx = mx + zone.x / POND.width * mw;
      const zy = my + zone.z / POND.length * mh;
      const zw = zone.rx / POND.width * mw;
      const zh = zone.rz / POND.length * mh;
      const active = zone.imageIndex === activeImageIndex;
      ctx.strokeStyle = active ? 'rgba(223,232,190,0.74)' : 'rgba(138,179,168,0.34)';
      ctx.strokeRect(zx - zw * 0.5, zy - zh * 0.5, zw, zh);
      ctx.fillStyle = active ? 'rgba(223,232,190,0.74)' : 'rgba(138,179,168,0.34)';
      ctx.fillRect(zx - 2, zy - 2, 4, 4);
    }
  }
  ctx.fillStyle = '#e0e9ce';
  ctx.beginPath();
  ctx.arc(mx + viewer.x / POND.width * mw, my + viewer.z / POND.length * mh, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(166,200,186,0.5)';
  ctx.fillText('PLAN', mx + 15, my + mh + 16);
}

function shortName(name) {
  if (!name || name === 'none') return 'none';
  return name.length > 28 ? name.slice(0, 25) + '...' : name;
}

function keyPressed() {
  if (key === 'f' || key === 'F') fogEnabled = !fogEnabled;
  if (key === '[') { fogDistance = clamp(fogDistance - 20, MIN_FOG, FAR); fogEnabled = true; }
  if (key === ']') { fogDistance = clamp(fogDistance + 20, MIN_FOG, FAR); fogEnabled = true; }
  if (key === 't' || key === 'T') scrambleEnabled = !scrambleEnabled;
  if (key === 'n' || key === 'N') sedimentEnabled = !sedimentEnabled;
  if (key === 'i' || key === 'I') imagesEnabled = !imagesEnabled;
  if (key === 'u' || key === 'U') { if (uploadInput) uploadInput.click(); }
  if (key === 'h' || key === 'H') showHUD = !showHUD;
  if (key === 'g' || key === 'G') showGrid = !showGrid;
  if (key === 'r' || key === 'R') {
    viewer = { x: 100, y: 64, z: 10, yaw: 0, vx: 0, vy: 0, vz: 0 };
    positionSensorColumnInFront();
  }
  if ([37, 38, 39, 40, 32].includes(keyCode)) return false;
}

function windowResized() {
  const bounds = drawingContext.canvas.parentElement.getBoundingClientRect();
  resizeCanvas(Math.max(1, Math.floor(bounds.width)), Math.max(1, Math.floor(bounds.height)));
}

function smooth(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function wrap(x, limit) { return (x % limit + limit) % limit; }
function mix(a, b, t) { return a + (b - a) * t; }
function seededRandom(seed) {
  return function() {
    seed |= 0;
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

</script>
<script>
if(typeof setup==='function') setup();
let last = performance.now();
function loop(now){
 deltaTime = now - last; last = now; frameCount++;
 if(typeof draw==='function') draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
